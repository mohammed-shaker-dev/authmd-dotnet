name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AuthMd.slnx

      - name: Build
        run: dotnet build AuthMd.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AuthMd.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack AuthMd.slnx --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
